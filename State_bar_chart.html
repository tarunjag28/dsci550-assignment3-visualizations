<html lang="en">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!info about the page>
  </head>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    .bar { fill: steelblue; }
    .bar:hover { fill: darkorange; }
    .axis-label { font-size: 14px; font-weight: bold; }
    .x-axis text { transform: rotate(-45deg); text-anchor: end; }
    .description { text-align: center; max-width: 800px; margin: 0 auto 20px auto; font-size: 16px; }
  </style>

<body>
<h2 style="text-align:center;">Top Haunted States</h2>
<p class="description">
  Similar to the city chart, this shows how haunted place counts vary by state. It helps identify which regions have the highest concentration of reported phenomena.
</p>
<div id="bar-chart"></div>
<script>
const svg = d3.select("#bar-chart").append("svg").attr("width", 960).attr("height", 600),
      margin = {top: 50, right: 30, bottom: 100, left: 60},
      width = +svg.attr("width") - margin.left - margin.right,
      height = +svg.attr("height") - margin.top - margin.bottom,
      g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

d3.json("state_counts.json") // make sure this path is correct
  .then(data => {
    console.log("Data loaded successfully:", data); // ✅ DEBUG LOG

    if (!Array.isArray(data) || data.length === 0) {
      console.warn("⚠️ Warning: Data is empty or not an array.");
      return;
    }

    data.sort((a, b) => b.count - a.count);
    const x = d3.scaleBand().domain(data.map(d => d.state)).range([0, width]).padding(0.1);
    const y = d3.scaleLinear().domain([0, d3.max(data, d => d.count)]).nice().range([height, 0]);

    g.append("g")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x))
      .selectAll("text")
      .attr("transform", "rotate(-45)")
      .style("text-anchor", "end");

    g.append("g").call(d3.axisLeft(y));

    g.selectAll(".bar")
      .data(data)
      .enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.state))
      .attr("y", d => y(d.count))
      .attr("width", x.bandwidth())
      .attr("height", d => height - y(d.count));
  })
  .catch(error => {
    console.error("❌ Error loading or parsing JSON data:", error); // ✅ ERROR HANDLING
  });
</script>
</body>
</html>
